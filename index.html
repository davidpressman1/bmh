<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BMH | Weekly Schedule</title>
  <style>
    /* Mimicking the original "noise" and clean aesthetic */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0f172a; /* Deep dark blue from the original theme */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* The subtle texture overlay from your original site */
    .noise {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("https://bmofhaverstraw.org/noise.png"); /* Assuming this link exists from your CSS */
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
    }

    .brand-mark img {
      width: 120px;
      height: auto;
      margin-bottom: 1.5rem;
    }

    .brand-text-main {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .brand-text-sub {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }

    .schedule-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background-color: #ffffff;
      color: #0f172a;
      padding: 18px 36px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .schedule-btn:hover {
      background-color: #f1f5f9;
      transform: translateY(-3px);
    }

    .footer-note {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <div class="container">
    <div class="brand-mark">
      <img src="https://bmofhaverstraw.org/bmh-logo.png" alt="BMH logo" />
    </div>
    
    <div class="brand-text-main">Bais Medrash of Haverstraw</div>
    <div class="brand-text-sub">Mt Ivy, New York</div>

    <a href="https://bmofhaverstraw.org/BMHWeeklyNewsletter.pdf" class="schedule-btn" target="_blank" rel="noopener">
      <span>📄</span> Open This Week's Schedule
    </a>

    <div class="footer-note">
      &copy; 2026 Bais Medrash of Haverstraw
    </div>
  </div>
</body>
</html>
