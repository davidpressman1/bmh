<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bais Medrash of Haverstraw</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0d1425; /* Exact dark navy from image */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    /* Circular Logo Styling */
    .logo-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
    }

    .location {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* Button Styles */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 50px; /* Pill shape */
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: opacity 0.2s;
    }

    /* Primary Schedule Button */
    .btn-white {
      background-color: #ffffff;
      color: #0d1425;
    }

    /* Donation Buttons */
    .btn-outline {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.95rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .zelle-subtext {
      display: block;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      font-family: monospace;
    }

    .charity-info {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 20px;
    }

    footer {
      margin-top: 50px;
      font-size: 0.85rem;
      color: #475569;
    }

    #copy-status {
      font-size: 0.7rem;
      color: #38bdf8;
      margin-left: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <img src="https://bmofhaverstraw.org/bmh-logo.png" alt="BMH Logo">
    </div>

    <h1>Bais Medrash of Haverstraw</h1>
    <div class="location">Mt Ivy, New York</div>

    <a href="https://bmofhaverstraw.org/BMHWeeklyNewsletter.pdf" class="btn btn-white" target="_blank">
      📄 Open This Week's Schedule
    </a>

    <div style="margin-top: 30px;">
      <a href="https://secure.cardknox.com/baismedrashofhaverstraw" class="btn btn-outline" target="_blank">
        💳 Donate via Credit Card
      </a>

      <div class="btn btn-outline" style="cursor: pointer; flex-direction: column; gap: 2px;" onclick="copyZelle()">
        <div>💸 Donate via Zelle <span id="copy-status">Copied!</span></div>
        <span class="zelle-subtext">bmhdonate@gmail.com</span>
      </div>
      
      <div class="charity-info">501(c)(3) charity organization</div>
    </div>

    <footer>
      &copy; 2026 Bais Medrash of Haverstraw
    </footer>
  </div>

  <script>
    function copyZelle() {
      const email = "bmhdonate@gmail.com";
      navigator.clipboard.writeText(email).then(() => {
        const status = document.getElementById('copy-status');
        status.style.display = 'inline';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
      });
    }
  </script>

</body>
</html>
